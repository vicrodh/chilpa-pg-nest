name: Package checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_VERSION: '6.11.2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the host-compatible Qt toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config python3-venv \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libdbus-1-3 libxcb-cursor0 xvfb xauth
          python3 -m venv "$RUNNER_TEMP/qt-installer"
          "$RUNNER_TEMP/qt-installer/bin/python" -m pip install aqtinstall==3.3.0
          "$RUNNER_TEMP/qt-installer/bin/python" -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 --outputdir "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Build and test the experimental package
        run: |
          python3 tools/build-native
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          xvfb-run -a env QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=rhi QSG_RHI_BACKEND=opengl \
            qmltestrunner -input tests
      - name: Verify and checksum the packages
        run: python3 tools/check-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nest-experimental-linux-x86_64-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/package-check.json
          if-no-files-found: error
          retention-days: 30
